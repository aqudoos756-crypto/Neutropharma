<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple welcome page built with HTML, CSS, and JavaScript."
    />
    <title>Hello, world!</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">A simple web page</p>
        <h1 id="page-title">Hello, world!</h1>
        <p class="intro">
          Welcome! This page keeps its structure, styling, and behavior in
          separate HTML, CSS, and JavaScript files.
        </p>
        <button class="button" id="greet-button" type="button">
          Say hello hi
        </button>
        <p class="message" id="greeting" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
